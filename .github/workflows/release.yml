name: "GitHub Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.0.1)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  create-github-release:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # Needed by the release/push step
      - name: Create GitHub Release
        uses: open-resource-discovery/github-release@2d8817b7382966b490d5c78125d97da14ee918bc # main @ 2026-11-14
        with:
          tag-template: "v<version>"
          version: ${{ inputs.version }}
          ci-workflows: none
    if: github.ref == 'refs/heads/main'
