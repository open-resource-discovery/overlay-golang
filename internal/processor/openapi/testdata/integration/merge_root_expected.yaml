components:
    schemas:
        Error:
            properties:
                code:
                    format: int32
                    type: integer
                message:
                    type: string
            required:
                - code
                - message
            type: object
        Pet:
            properties:
                id:
                    format: int64
                    type: integer
                name:
                    type: string
                tag:
                    type: string
            required:
                - id
                - name
            type: object
        Pets:
            items:
                $ref: '#/components/schemas/Pet'
            type: array
externalDocs:
    description: Full documentation
    url: https://docs.petstore.example
info:
    contact:
        email: support@petstore.example
        name: Petstore Support
    description: Manage pet records for a pet shop.
    title: Petstore
    version: 1.0.0
openapi: 3.0.3
paths:
    /pets:
        get:
            description: Returns a list of all pets in the system.
            operationId: listPets
            parameters:
                - description: Maximum number of items to return.
                  in: query
                  name: limit
                  required: false
                  schema:
                    format: int32
                    maximum: 100
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Pets'
                    description: A list of pets.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Unexpected error.
            summary: List all pets
            tags:
                - Pets
        post:
            description: Adds a new pet to the system.
            operationId: createPets
            responses:
                "201":
                    description: Pet created successfully.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid request body.
            summary: Create a pet
            tags:
                - Pets
    /pets/{petId}:
        get:
            description: Returns a single pet by its ID.
            operationId: showPetById
            parameters:
                - description: The ID of the pet to retrieve.
                  in: path
                  name: petId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Pet'
                    description: The requested pet.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Pet not found.
            summary: Get a pet
            tags:
                - Pets
servers:
    - description: Production
      url: https://api.petstore.example/v1
    - description: Sandbox
      url: https://sandbox.petstore.example/v1
x-sap-shortText: Manages pet records for your pet shop.
x-sap-stateInfo:
    deprecationDate: "2026-12-31"
    state: Active
